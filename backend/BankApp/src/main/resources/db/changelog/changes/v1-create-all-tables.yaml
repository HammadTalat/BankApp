databaseChangeLog:

  - changeSet:
      id: 001-create-app-user-table
      author: bank-team
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: approval_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false


  - changeSet:
      id: 002-create-local-credential-table
      author: bank-team
      changes:
        - createTable:
            tableName: local_credential
            columns:
              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: local_credential
            baseColumnNames: email
            referencedTableName: app_user
            referencedColumnNames: email
            constraintName: fk_local_credential_user
            onDelete: RESTRICT


  - changeSet:
      id: 003-create-bank-account-table
      author: bank-team
      changes:
        - createTable:
            tableName: bank_account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: account_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

        - addForeignKeyConstraint:
            baseTableName: bank_account
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_bank_account_user
            onDelete: RESTRICT


  - changeSet:
      id: 004-create-account-balance-table
      author: bank-team
      changes:
        - createTable:
            tableName: account_balance
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: balance_date
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false

              - column:
                  name: indicator
                  type: VARCHAR(10)
                  defaultValue: NONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: account_balance
            baseColumnNames: account_id
            referencedTableName: bank_account
            referencedColumnNames: id
            constraintName: fk_account_balance_account
            onDelete: RESTRICT


  - changeSet:
      id: 005-create-account-transaction-table
      author: bank-team
      changes:
        - createTable:
            tableName: account_transaction
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: operation_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: recipient_account_id
                  type: BIGINT
                  constraints:
                    nullable: true

              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: indicator
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_date
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: account_transaction
            baseColumnNames: account_id
            referencedTableName: bank_account
            referencedColumnNames: id
            constraintName: fk_transaction_account
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: account_transaction
            baseColumnNames: recipient_account_id
            referencedTableName: bank_account
            referencedColumnNames: id
            constraintName: fk_transaction_recipient
            onDelete: RESTRICT


  - changeSet:
      id: 006-insert-default-admin
      author: bank-team
      changes:
        - insert:
            tableName: app_user
            columns:
              - column:
                  name: name
                  value: Admin

              - column:
                  name: email
                  value: admin@bank.local

              - column:
                  name: address
                  value: System

              - column:
                  name: role
                  value: ADMIN

              - column:
                  name: approval_status
                  value: APPROVED

        - insert:
            tableName: local_credential
            columns:
              - column:
                  name: email
                  value: admin@bank.local

              - column:
                  name: password_hash
                  value: "$2y$10$DUaN4g70PjF/gKGUGjER5eUPSriVP4LoQNItQXGJwoQv1aqNNaUUS"