databaseChangeLog:

  - changeSet:
      id: 007-update-local-credential-foreign-key
      author: bank-team
      changes:
        - dropForeignKeyConstraint:
            baseTableName: local_credential
            constraintName: fk_local_credential_user

        - addForeignKeyConstraint:
            baseTableName: local_credential
            baseColumnNames: email
            referencedTableName: app_user
            referencedColumnNames: email
            constraintName: fk_local_credential_user
            onDelete: RESTRICT
            onUpdate: CASCADE
  - changeSet:
      id: 009-remove-account-balance-unique-constraint
      author: bank-team
      changes:
        - dropUniqueConstraint:
            tableName: account_balance
            constraintName: account_balance_account_number_key