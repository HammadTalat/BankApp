spring:
  application:
    name: BankApp
  profiles:
    default: dev
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_MODEL:gemini-flash-latest}
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: 768
    vectorstore:
      pgvector:
        dimensions: 768

    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        initialized: false
        name: redmath-bank-ai-client
        version: 1.0.0
        type: SYNC

        streamable-http:
          connections:
            redmath-bank:
              url: ${MCP_SERVER_URL:http://localhost:8082}
              endpoint: /mcp
management:
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false

  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    env:
      enabled: false
      show-values: never
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

jwt:
  public:
    key: ${JWT_PUBLIC_KEY:classpath:keys/public_key.pem}
  private:
    key: ${JWT_PRIVATE_KEY:classpath:keys/private_key.pem}

bootui:
  enabled: ON