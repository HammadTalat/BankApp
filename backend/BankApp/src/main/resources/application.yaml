server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: BankApp
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}

  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/banking_db}
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  profiles:
    active:
      - dev
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_MODEL:gemini-flash-latest}
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: 768
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768

    mcp:
      client:
        # MCP is optional: the core banking application must start independently.
        enabled: ${MCP_ENABLED:false}
        # Discover tools on first use instead of failing BankApp startup if MCP is offline.
        initialized: false
        name: redmath-bank-ai-client
        version: 1.0.0
        type: SYNC

        streamable-http:
          connections:
            redmath-bank:
              url: ${MCP_SERVER_URL:http://localhost:8082}
              endpoint: /mcp
management:
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false

services:
  anomaly-detection:
    url: ${ANOMALY_DETECTION_URL:http://localhost:8080}
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  ai:
    chat-memory-size: 8
    rag:
      top-k: 2
      similarity-threshold: 0.40
