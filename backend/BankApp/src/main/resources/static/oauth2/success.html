<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>BankApp Login Success</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b 0, var(--bg) 55%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .card {
      width: min(720px, calc(100vw - 32px));
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .status {
      color: var(--accent);
      font-weight: 700;
    }

    .grid {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.16);
      overflow: hidden;
    }

    .label {
      color: var(--accent-2);
      font-weight: 700;
      white-space: nowrap;
    }

    .value {
      word-break: break-word;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    button, a {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      background: var(--accent);
      color: #052e16;
    }

    a {
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.28);
    }

    .small {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
<main class="card">
  <h1>Login successful</h1>
  <p class="status">Google authentication completed. Your JWT and profile details are available
    below.</p>

  <div class="grid">
    <div class="row">
      <div class="label">Email</div>
      <div class="value" id="email"></div>
    </div>
    <div class="row">
      <div class="label">Name</div>
      <div class="value" id="name"></div>
    </div>
    <div class="row">
      <div class="label">Role</div>
      <div class="value" id="role"></div>
    </div>
    <div class="row">
      <div class="label">Token Type</div>
      <div class="value" id="tokenType"></div>
    </div>
    <div class="row">
      <div class="label">Expires In</div>
      <div class="value" id="expiresIn"></div>
    </div>
    <div class="row">
      <div class="label">Access Token</div>
      <div class="value" id="accessToken"></div>
    </div>
  </div>

  <div class="actions">
    <button id="copyToken">Copy Token</button>
    <a href="/">Go Home</a>
  </div>

  <div class="small">This page is a stable landing page after OAuth login. Refreshing it will not
    restart Google sign-in.
  </div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const values = {
    email: params.get('email') || '',
    name: params.get('name') || '',
    role: params.get('role') || '',
    tokenType: params.get('tokenType') || '',
    expiresIn: params.get('expiresIn') || '',
    accessToken: params.get('accessToken') || ''
  };

  localStorage.setItem('bankapp_access_token', values.accessToken);
  localStorage.setItem('bankapp_token_type', values.tokenType);

  // Replace the callback URL so refresh/back does not revisit the OAuth callback.
  history.replaceState(null, '', '/oauth2/success.html');
  history.pushState({bankappSuccess: true}, '', '/oauth2/success.html');

  window.addEventListener('popstate', () => {
    history.pushState({bankappSuccess: true}, '', '/oauth2/success.html');
  });

  document.getElementById('email').textContent = values.email;
  document.getElementById('name').textContent = values.name;
  document.getElementById('role').textContent = values.role;
  document.getElementById('tokenType').textContent = values.tokenType;
  document.getElementById('expiresIn').textContent = values.expiresIn + ' seconds';
  document.getElementById('accessToken').textContent = values.accessToken;

  document.getElementById('copyToken').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(values.accessToken);
      alert('Token copied to clipboard');
    } catch (error) {
      alert('Could not copy token');
    }
  });
</script>
</body>
</html>
