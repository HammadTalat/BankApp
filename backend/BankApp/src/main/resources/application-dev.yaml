server:
  port: 8081
  address: 0.0.0.0

spring:
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/banking_db}
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true

services:
  anomaly-detection:
    url: ${ANOMALY_DETECTION_URL:http://localhost:8080}
