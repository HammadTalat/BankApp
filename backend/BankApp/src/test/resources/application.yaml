server:
  port: 0

jwt:
  public:
    key: classpath:keys/test-public.pem
  private:
    key: classpath:keys/test-private.pem

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - profile
              - email
            redirect-uri: http://localhost/login/oauth2/code/google
  datasource:
    url: ${TEST_PG_URL:jdbc:postgresql://localhost:5432/banking_test}
    username: ${TEST_PG_USERNAME:postgres}
    password: ${TEST_PG_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  ai:
    google:
      genai:
        api-key: test-key
        embedding:
          api-key: test-key
    vectorstore:
      pgvector:
        initialize-schema: false
    mcp:
      client:
        enabled: false

services:
  anomaly-detection:
    url: http://localhost:65535
