name: Deploy to Azure VPS

on:
  push:
    branches:
      - deployment/talhavps  # Change to 'master' if your main branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Navigate to your project directory on the VPS
            cd /home/azureuser/deployment/BankApp-RedMath

            # Pull the latest changes from GitHub
            git reset --hard HEAD
            git pull origin deployment/talhavps

            # Rebuild and restart Docker containers in detached mode
            docker compose down
            docker compose up -d --build
