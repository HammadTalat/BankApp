version: '3.8'

services:
  # ==========================================
  # Database: PostgreSQL with PGVector Support
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: ${PG_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME:-postgres} -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend: Main Bank App (BankApp)
  # ==========================================
  backend:
    build:
      context: ./backend/BankApp
      dockerfile: Dockerfile
    container_name: backend-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8081/login/oauth2/code/google}
      PG_URL: ${PG_URL:-jdbc:postgresql://postgres:5432/banking_db}
      PG_USERNAME: ${PG_USERNAME:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcpserver:8082}
      ANOMALY_DETECTION_URL: ${ANOMALY_DETECTION_URL:-http://anomalydetectionservice:8080}
    depends_on:
      postgres:
        condition: service_healthy
      mcpserver:
        condition: service_started
      anomalydetectionservice:
        condition: service_started

  # ==========================================
  # Service: Anomaly Detection (TransactionVerification)
  # ==========================================
  anomalydetectionservice:
    build:
      context: ./anomaly-detection-service
      dockerfile: Dockerfile
    container_name: anomaly-detection-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  # ==========================================
  # Service: MCP Server (redmath-bank-mcp)
  # ==========================================
  mcpserver:
    build:
      context: ./redmath-bank-mcp
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      MCP_SERVER_PORT: "8082"
      MCP_SERVER_ADDRESS: "0.0.0.0"
      BANK_API_BASE_URL: ${BANK_API_BASE_URL:-http://backend:8081}

  # ==========================================
  # Frontend: React UI
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
    container_name: frontend-service
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
    depends_on:
      - backend

volumes:
  pgdata:
