version: '3.8'

services:
  # ------------------------------------------
  # Database
  # ------------------------------------------
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: postgres-db

    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: ${PG_USERNAME}
      POSTGRES_PASSWORD: ${PG_PASSWORD}

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
  # ------------------------------------------
  # Main Banking Spring Boot App
  # ------------------------------------------
  bank-app:
    build:
      context: ./backend/BankApp/
      dockerfile: Dockerfile
    container_name: bank-app
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/bankdb
      SPRING_DATASOURCE_USERNAME: ${PG_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
      # Connection URL to the LLM Microservice via container network
      ANOMALY_DETECTION_URL: http://anomaly-service:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      MCP_SERVER_URL: http://mcp-server:8082
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-net

  mcp-server:
    build:
      context: ./redmath-bank-mcp
      dockerfile: Dockerfile

    container_name: mcp-server

    restart: unless-stopped

    environment:
      MCP_SERVER_ADDRESS: 0.0.0.0
      MCP_SERVER_PORT: 8082
      BANK_API_BASE_URL: http://bank-app:8081

    expose:
      - "8082"

    depends_on:
      - bank-app

    networks:
      - app-net
  # ------------------------------------------
  # anomaly Microservice
  # ------------------------------------------
  anomaly-service:
    build:
      context: ./anomaly-detection-service
      dockerfile: Dockerfile
    container_name: anomaly-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Inject your LLM API Key here or load from a .env file
      OPENAI_API_KEY: ${OPENAI_API_KEY:-defaultkey}
    networks:
      - app-net

  # ------------------------------------------
  # React Frontend
  # ------------------------------------------
  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react-frontend
    restart: unless-stopped
    ports:
      - "3000:80" # Access UI at http://localhost:3000
    depends_on:
      - bank-app
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
